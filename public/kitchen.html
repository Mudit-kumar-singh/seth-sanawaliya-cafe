<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Display • Seth Sanwaliya</title>
<link rel="stylesheet" href="styles.css">
<style>
body{background:#0a0a0a}.k-wrap{max-width:1500px;margin:auto;padding:18px}.k-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.k-title{font-family:"Playfair Display";font-size:32px}.k-meta{color:var(--muted);font-size:13px}.k-filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.k-filters button{padding:9px 14px;border-radius:999px;border:1px solid #383838;background:#171717;color:#ddd}.k-filters button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}.k-filters span{display:inline-flex;min-width:18px;justify-content:center;margin-left:4px;font-size:11px}.k-grid{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:14px}.k-card{background:#151515;border:1px solid #2b2b2b;border-radius:18px;padding:16px;box-shadow:0 12px 35px #0005}.k-card.new{border-color:#b9812c;box-shadow:0 0 0 1px #b9812c33,0 15px 40px #0006}.k-card.ready{border-color:#2e9e64}.k-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.k-table{font-size:25px;font-weight:800;color:var(--gold2)}.k-order{color:#aaa;font-size:12px}.k-time{font-size:12px;color:#aaa}.k-items{margin:14px 0}.k-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #292929}.k-item:last-child{border-bottom:0}.k-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k-actions button{padding:11px;border-radius:10px;border:1px solid #444;background:#202020;color:#fff}.k-actions .go{background:var(--gold);color:#111;border-color:var(--gold)}.k-empty{text-align:center;padding:70px 20px;color:#777}.live{display:inline-flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
@media(max-width:1000px){.k-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.k-grid{grid-template-columns:1fr}.k-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div id="kitchen"></div><script src="kitchen.js"></script></body></html>
